<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:12px Inter,system-ui,sans-serif;color:#4a567a}
body{background:#f5f7fd}.gallery{height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 10% 0,#e6e6fd,transparent 58%),radial-gradient(ellipse at 90% 85%,#dff4ef,transparent 65%),#f7f8ff}
.stage{position:relative;flex:1;min-height:180px;overflow:hidden}#mol{position:absolute;inset:0;opacity:1;transition:opacity .18s ease}.switching #mol{opacity:.3}
.top{position:absolute;top:15px;left:17px;right:17px;display:flex;align-items:center;justify-content:space-between;z-index:2;pointer-events:none;gap:12px}.identity{display:flex;align-items:center;gap:9px;pointer-events:auto}.identity b{font-size:16px;font-weight:550;color:#4f5579;letter-spacing:-.5px}.identity a{font-size:10px;color:#8e85b0;text-decoration:none;padding:5px 7px;border:1px solid #d9d5ee;border-radius:6px;background:#ffffff95}
.controls{display:flex;align-items:center;gap:5px;pointer-events:auto}button,select{font:inherit;color:#746c99;border:1px solid #e0dff0;background:#ffffffdf;border-radius:9px;cursor:pointer}button:hover,select:hover{background:#fff;border-color:#bfb2e1}button:focus-visible,select:focus-visible{outline:2px solid #b49be3;outline-offset:3px}.icon{width:32px;height:32px;display:grid;place-items:center}.icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon[aria-pressed=true]{background:#e9e2fa;color:#7956b3;border-color:#c9b9e8}select{padding:7px;max-width:110px;font-size:10px}
.bottom{position:absolute;bottom:13px;left:18px;right:18px;display:flex;align-items:center;gap:8px;pointer-events:none}.bottom select{pointer-events:auto}.legend{margin-left:auto;font-size:9px;color:#9ca2bb;display:flex;align-items:center;gap:6px}.legend i{width:5px;height:5px;border-radius:50%;background:#e3ac70}.hint{position:absolute;left:18px;bottom:15px;color:#a4aac0;font-size:9px;pointer-events:none}
.filmstrip{flex:0 0 112px;display:flex;align-items:center;gap:10px;padding:11px 13px;background:#ffffffa8;border-top:1px solid #e3e6f2;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#d3cce5 transparent;scroll-behavior:smooth}.thumb{position:relative;flex:0 0 104px;height:87px;padding:0;overflow:hidden;border-radius:11px;background:linear-gradient(130deg,#f4f0fc,#eff7f8);border:1px solid #e4e2ef;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.thumb:hover{transform:translateY(-2px);border-color:#b3a3d7;box-shadow:0 5px 13px #8679ac19}.thumb[aria-pressed=true]{border:2px solid #9c85cc;background:#f0eafa;box-shadow:0 0 0 3px #eae2f75c}.thumb img{display:block;width:100%;height:65px;object-fit:contain;opacity:0;transition:opacity .25s}.thumb img.ready{opacity:1}.thumb .label{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:5px 7px;background:#ffffffcb;font-size:9px;color:#697291}.thumb .label small{font-size:8px;color:#a095ba;max-width:49px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumb .dot{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:#b1c9df}.thumb[aria-pressed=true] .dot{background:#ad86d8}.skeleton{position:absolute;top:15px;left:35px;width:30px;height:30px;border:1px solid #d3cfeb;border-radius:50%;opacity:.5}.ready+.skeleton{display:none}
#error{position:absolute;left:18px;right:18px;bottom:45px;color:#ae6a79;font-size:11px;z-index:3}#thumb-render{position:absolute;width:180px;height:110px;left:-10000px;top:0}
@media(max-width:470px){.top{top:12px;left:12px;right:12px;align-items:flex-start}.identity{gap:6px}.identity b{font-size:13px}.controls{gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:205px}.icon{width:28px;height:28px}select{max-width:86px;padding:6px}.filmstrip{gap:8px;padding:10px;flex-basis:103px}.thumb{flex-basis:92px;height:82px}.thumb img{height:59px}.legend{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="gallery"><div class="stage" id="stage"><div id="mol" role="img" aria-label="Interactive experimental protein structure"></div>
<div class="top"><div class="identity"><b id="target"></b><a id="pdb" target="_blank" rel="noopener noreferrer"></a></div><div class="controls">
<select id="ligand" aria-label="Bound ligand"></select>
<button class="icon" id="focus" aria-label="Focus ligand" title="Focus ligand"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
<button class="icon" id="fit" aria-label="Fit structure" title="Fit structure"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M8 8l8 8m0-8-8 8"/></svg></button>
<button class="icon" id="spin" aria-label="Rotate structure" aria-pressed="false" title="Rotate"><svg viewBox="0 0 24 24"><path d="M19 9a8 8 0 1 0 0 7M19 3v6h-6"/></svg></button>
</div></div><div class="bottom"><select id="frame" aria-label="Deposited model" hidden></select><span class="legend"><i></i> Bound components</span></div><div id="error" role="status"></div></div>
<div class="filmstrip" id="filmstrip" aria-label="Experimental structure thumbnails"></div></div><div id="thumb-render" aria-hidden="true"></div>
<script>/*__LIBRARY__*/</script><script type="application/json" id="scene-data">/*__SCENES__*/</script>
<script>
(async function(){'use strict';const dataset=JSON.parse(document.getElementById('scene-data').textContent),scenes=dataset.scenes;
const el=id=>document.getElementById(id),reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let active=-1,viewer=null,thumbnailViewer=null,spinning=false,selectionVersion=0;
const colors=['#70a7e8','#94c9cc','#b39ad8','#8dbcdc'];
function ligandSelection(){const k=el('ligand').value;return k.startsWith('chain:')?{chain:k.slice(6)}:k?{resn:k}:{hetflag:true,not:{resn:['HOH','DOD']}}}
function style(v,scene,focused,thumbnail=false){v.setStyle({},{cartoon:{color:'#c6cee2',opacity:.6}});scene.chains.forEach((chain,i)=>v.setStyle({chain},{cartoon:{color:colors[i%colors.length],opacity:1}}));v.setStyle({hetflag:true,not:{resn:['HOH','DOD']}},{stick:{radius:thumbnail?.2:.18,colorscheme:'orangeCarbon'}});if(focused)v.setStyle(focused,{stick:{radius:.24,colorscheme:'orangeCarbon'}});}
function load(v,scene){v.removeAllModels();v.addModelsAsFrames(scene.text,scene.format);if(!v.getModel()||!v.getModel().selectedAtoms({}).length)throw Error('No atoms could be displayed.');}
async function choose(index){if(index===active)return;const version=++selectionVersion;el('stage').classList.add('switching');await new Promise(resolve=>requestAnimationFrame(resolve));if(version!==selectionVersion)return;
try{const scene=scenes[index];viewer.spin(false);spinning=false;el('spin').setAttribute('aria-pressed','false');load(viewer,scene);active=index;
el('target').textContent=dataset.target;el('pdb').textContent=scene.id;el('pdb').href='https://www.rcsb.org/structure/'+encodeURIComponent(scene.id);el('pdb').title=scene.title+' · '+scene.methods.join(', ')+' · '+(scene.resolution||'—')+' Å'+(scene.mutations.length?' · Mutations: '+scene.mutations.join(', '):'');
el('ligand').replaceChildren();const all=document.createElement('option');all.value='';all.textContent='All ligands';el('ligand').appendChild(all);scene.ligands.forEach(row=>{const o=document.createElement('option');o.value=row.value;o.textContent=row.label;o.title=row.name;el('ligand').appendChild(o)});el('ligand').value=scene.ligands[0]?.value||'';el('ligand').hidden=!scene.ligands.length;
style(viewer,scene,ligandSelection());viewer.zoomTo();viewer.zoom(.9);viewer.render();el('focus').disabled=!viewer.getModel().selectedAtoms(ligandSelection()).length;
const count=viewer.getNumFrames();el('frame').replaceChildren();el('frame').hidden=count<2;for(let i=0;i<count;i++){const o=document.createElement('option');o.value=i;o.textContent='Model '+(i+1)+' / '+count;el('frame').appendChild(o)}
el('error').textContent=count!==scene.models?'Showing '+count+' of '+scene.models+' deposited models.':'';
Array.from(el('filmstrip').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));el('mol').setAttribute('aria-label','Experimental structure '+scene.id+' with deposited ligands');
}catch(error){el('error').textContent='3D unavailable: '+error.message}finally{requestAnimationFrame(()=>el('stage').classList.remove('switching'))}}
try{viewer=$3Dmol.createViewer('mol',{backgroundColor:'#f5f7fd',backgroundAlpha:0,antialias:true});
scenes.forEach((scene,i)=>{const button=document.createElement('button');button.className='thumb';button.type='button';button.setAttribute('aria-label','View '+scene.id);button.setAttribute('aria-pressed','false');button.title=scene.title;const img=document.createElement('img');img.alt=scene.id+' structure preview';button.appendChild(img);const skeleton=document.createElement('span');skeleton.className='skeleton';button.appendChild(skeleton);const label=document.createElement('span');label.className='label';const id=document.createElement('span');id.textContent=scene.id;label.appendChild(id);const ligand=document.createElement('small');ligand.textContent=scene.ligands.map(l=>l.label).join(' · ')||'apo';label.appendChild(ligand);button.appendChild(label);const dot=document.createElement('i');dot.className='dot';button.appendChild(dot);button.onclick=()=>choose(i);el('filmstrip').appendChild(button)});
if(!scenes.length)throw Error('No experimental coordinates available.');await choose(0);
el('fit').onclick=()=>{viewer.zoomTo({},reduced?0:320);viewer.render()};el('focus').onclick=()=>{viewer.zoomTo(ligandSelection(),reduced?0:380);viewer.render()};el('spin').onclick=()=>{spinning=!spinning;viewer.spin(spinning?'y':false, .35);el('spin').setAttribute('aria-pressed',String(spinning))};el('ligand').onchange=()=>{style(viewer,scenes[active],ligandSelection());viewer.render();el('focus').disabled=!viewer.getModel().selectedAtoms(ligandSelection()).length};el('frame').onchange=async()=>{await viewer.setFrame(Number(el('frame').value));style(viewer,scenes[active],ligandSelection());viewer.render()};
let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{viewer.resize();viewer.render()},80)}).observe(el('stage'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)viewer.spin(false);else if(spinning)viewer.spin('y',.35)});
// Generate thumbnails from the same deposited coordinates, one context at a time.
thumbnailViewer=$3Dmol.createViewer('thumb-render',{backgroundColor:'#f1f2fb',backgroundAlpha:0,antialias:true});
for(let i=0;i<scenes.length;i++){await new Promise(resolve=>setTimeout(resolve,80));try{load(thumbnailViewer,scenes[i]);style(thumbnailViewer,scenes[i],null,true);thumbnailViewer.zoomTo();thumbnailViewer.render();const img=el('filmstrip').children[i].querySelector('img');img.src=thumbnailViewer.pngURI();img.classList.add('ready')}catch(_){el('filmstrip').children[i].title+=' · Thumbnail unavailable'}}thumbnailViewer.clear();
}catch(error){el('error').textContent='3D unavailable: '+error.message}
})();
</script></body></html>
